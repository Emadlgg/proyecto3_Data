# Uso rápido (los datos institucionales los entrega la cátedra y NO viven en el repo ni en la imagen):
#   1) Colocar los archivos originales en ./data/raw
#   2) docker compose --profile tools run --rm etl       # genera ./data/processed
#   3) docker compose up --build dashboard               # http://localhost:8501
services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped

  etl:
    build: .
    profiles: ["tools"]
    command:
      - sh
      - -c
      - >
        python -m src.etl &&
        python -m src.validaciones &&
        python -m src.indicadores &&
        python -m src.mercados_emisores &&
        python -m src.predicciones &&
        python -m src.encuestas
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - ./docs:/app/docs
    restart: "no"

  mlflow:
    build:
      context: .
      args:
        REQS: requirements.txt
    profiles: ["tools"]
    command:
      - python
      - -m
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////app/state/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /app/state/mlartifacts
      - --allowed-hosts
      - mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_state:/app/state
    restart: unless-stopped

  pipeline:
    build:
      context: .
      args:
        REQS: requirements.txt
    profiles: ["tools"]
    command:
      - python
      - -m
      - src.pipeline
      - --config
      - config/mlops.json
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_COMMIT: ${GIT_COMMIT:-desconocido}
    depends_on:
      - mlflow
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - ./artifacts:/app/artifacts
    restart: "no"

volumes:
  mlflow_state:
